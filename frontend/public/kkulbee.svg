<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 250">
  <!-- 꿀비 정적판 — 3D 최종형(한 덩어리 머리·얼굴 두른 검은 띠·방울 더듬이)과
       같은 얼굴. 파비콘·챗봇 버튼·발표자료가 이 파일을 씁니다. -->
  <defs>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD96B"/><stop offset=".55" stop-color="#FFC42E"/>
      <stop offset="1" stop-color="#E89B04"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD35C"/><stop offset="1" stop-color="#E89B04"/>
    </linearGradient>
  </defs>
  <ellipse cx="110" cy="238" rx="46" ry="8" fill="rgba(56,50,42,.14)"/>
  <!-- 날개 -->
  <ellipse cx="52" cy="118" rx="30" ry="42" fill="#EAF4FF" opacity=".85" transform="rotate(-24 52 118)"/>
  <ellipse cx="168" cy="118" rx="30" ry="42" fill="#EAF4FF" opacity=".85" transform="rotate(24 168 118)"/>
  <!-- 더듬이: 짧고 통통, 큰 방울 -->
  <path d="M88 34 Q82 20 74 15" stroke="#33251A" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M132 34 Q138 20 146 15" stroke="#33251A" stroke-width="7" fill="none" stroke-linecap="round"/>
  <circle cx="72" cy="13" r="10" fill="#33251A"/><circle cx="148" cy="13" r="10" fill="#33251A"/>
  <circle cx="69.5" cy="10" r="3" fill="#fff" opacity=".85"/><circle cx="145.5" cy="10" r="3" fill="#fff" opacity=".85"/>
  <!-- 머리: 한 덩어리 -->
  <circle cx="110" cy="96" r="66" fill="url(#hood)"/>
  <!-- 얼굴 둘레 검은 띠 + 크림 얼굴 -->
  <ellipse cx="110" cy="100" rx="52" ry="47" fill="#33251A"/>
  <ellipse cx="110" cy="100" rx="45" ry="40" fill="#FDEED6"/>
  <!-- 눈: 작고 반짝(큰+작은 광점) -->
  <ellipse cx="92" cy="95" rx="8.5" ry="10" fill="#241a10"/>
  <ellipse cx="128" cy="95" rx="8.5" ry="10" fill="#241a10"/>
  <circle cx="89.5" cy="91.5" r="3.2" fill="#fff"/><circle cx="125.5" cy="91.5" r="3.2" fill="#fff"/>
  <circle cx="95" cy="99" r="1.6" fill="#fff" opacity=".7"/><circle cx="131" cy="99" r="1.6" fill="#fff" opacity=".7"/>
  <!-- 볼터치 은은 -->
  <ellipse cx="76" cy="108" rx="8" ry="4.5" fill="#FFA39B" opacity=".4"/>
  <ellipse cx="144" cy="108" rx="8" ry="4.5" fill="#FFA39B" opacity=".4"/>
  <!-- 미소 -->
  <path d="M101 112 q9 8 18 0" stroke="#5A4636" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <!-- 몸통: 굵은 줄무늬 -->
  <ellipse cx="110" cy="192" rx="52" ry="46" fill="url(#body)"/>
  <path d="M60 176 Q110 190 160 176 L160 192 Q110 207 60 192 Z" fill="#33251A"/>
  <path d="M63 205 Q110 220 157 205 L154 219 Q110 233 66 219 Z" fill="#33251A"/>
  <!-- 팔·발 -->
  <ellipse cx="55" cy="182" rx="10" ry="13" fill="#33251A" transform="rotate(20 55 182)"/>
  <ellipse cx="165" cy="182" rx="10" ry="13" fill="#33251A" transform="rotate(-20 165 182)"/>
  <ellipse cx="92" cy="234" rx="11" ry="8" fill="#33251A"/>
  <ellipse cx="128" cy="234" rx="11" ry="8" fill="#33251A"/>
</svg>
